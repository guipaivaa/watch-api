spring:
  application:
    name: watch-api
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: watchdb
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:/db/migration
